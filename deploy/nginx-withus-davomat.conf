# /etc/nginx/sites-available/withus-davomat
# DOMEN ni o'zingiznikiga almashtiring. HTTPS qismini certbot o'zi qo'shadi.
server {
    listen 80;
    listen [::]:80;
    server_name DOMEN;

    root /var/www/withus-davomat;
    index index.html;

    # Bir sahifali ilova: noma'lum yo'llar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nomida hash bor fayllar o'zgarmaydi — uzoq keshlash
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html har doim yangisi olinsin (yangilanish darhol yetib borishi uchun)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
